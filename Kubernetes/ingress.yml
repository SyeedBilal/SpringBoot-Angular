# ============================================================
# Ingress — Route external traffic to frontend & backend
# ============================================================
# Prerequisites:
#   - An Ingress Controller must be installed (e.g. nginx-ingress)
#   - Update the host value below to match your domain or IP
# ============================================================
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: employee-app-ingress
  namespace: employee-app
  labels:
    app.kubernetes.io/name: employee-management-system
    app.kubernetes.io/component: ingress
  annotations:
    # ─── ALB Controller annotations ───
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip          # Direct to pod IPs (works with VPC CNI)

    # ─── Link YOUR Terraform ALB Security Group ───
    alb.ingress.kubernetes.io/security-groups: "sg-0f6247e89ed7e30f1"   # ← sg_alb_id
    alb.ingress.kubernetes.io/manage-backend-security-group-rules: "true"

    # ─── Health check config ───
    alb.ingress.kubernetes.io/healthcheck-path: /
    alb.ingress.kubernetes.io/healthcheck-interval-seconds: "15"
    alb.ingress.kubernetes.io/healthcheck-timeout-seconds: "5"

    # ─── Listener ───
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP": 80}]'

    # ─── For HTTPS (add later) ───
    # alb.ingress.kubernetes.io/listen-ports: '[{"HTTP": 80}, {"HTTPS": 443}]'
    # alb.ingress.kubernetes.io/certificate-arn: arn:aws:acm:ap-south-1:<ACCOUNT>:certificate/<CERT_ID>
    # alb.ingress.kubernetes.io/ssl-redirect: "443"

    # ─── Tags for cost tracking ───
    alb.ingress.kubernetes.io/tags: Project=emp-management,Environment=dev
spec:
  ingressClassName: alb
  rules:
    - http:
        paths:
          # API requests → backend
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: backend-service
                port:
                  number: 8080
          # Everything else → frontend
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend-service
                port:
                  number: 80
